name: Intraday PAPER Read-Only API Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline API shape safety tests
        run: python -m unittest -v test_intraday_account_identity.py test_intraday_paper_api_diagnostic.py test_intraday_account_history.py
      - name: Inspect dedicated PAPER history using GET only
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
          ALPACA_INTRADAY_EXPECTED_ACCOUNT_ID: ${{ secrets.ALPACA_INTRADAY_EXPECTED_ACCOUNT_ID }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_paper_api_diagnostic.py
