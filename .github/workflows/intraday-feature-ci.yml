name: Intraday Feature Branch Safety CI
on:
  push:
    branches:
      - feature/intraday-momentum-paper-engine
    paths:
      - 'intraday_*.py'
      - 'test_intraday_*.py'
      - '.github/workflows/intraday-feature-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intraday-feature-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run read-only intraday safety suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v test_intraday_account_identity.py test_intraday_position_snapshot.py test_intraday_restart_safety.py test_intraday_paper_api_diagnostic.py test_intraday_window_ledger.py test_intraday_account_history.py test_intraday_reconciliation_evidence.py test_intraday_reconciliation_health.py test_intraday_recovery_restart_gate.py test_intraday_recovery_checkpoint_write.py test_intraday_recovery_checkpoint_db.py test_intraday_recovery_journal.py test_intraday_recovery_simulator.py test_intraday_risk_snapshot.py test_intraday_health_probe.py test_intraday_monitor_health.py test_intraday_recovery_evidence_assessment.py test_intraday_atomic_recovery_snapshot.py test_intraday_durable_execution_comparison.py test_intraday_broker_fill_quantity.py test_intraday_snapshot_consistency.py test_intraday_live_order_probe.py test_intraday_persisted_broker_reconciliation.py test_intraday_persistent_recovery_simulator.py test_intraday_durable_event_audit.py test_intraday_order_state_replay.py test_intraday_recovery_scenarios.py test_intraday_backfill_diagnostic.py test_intraday_history_backfill.py test_intraday_observation_bundle.py test_intraday_integrated_reconciliation.py test_intraday_history_coverage.py test_intraday_recovery_diagnostic.py test_intraday_recovery_readiness.py test_intraday_database_readiness.py test_intraday_durable_ownership_probe.py test_intraday_open_order_ownership.py test_intraday_durable_fill_reconciliation.py test_intraday_fill_diagnostic.py test_intraday_alpaca_fills.py test_intraday_fill_attribution.py test_intraday_order_ownership.py test_intraday_lifecycle_integration.py test_intraday_broker_recovery.py test_intraday_execution_protocol.py test_intraday_eod_reconciliation.py test_intraday_durable_ack.py 2>&1 | tee intraday-feature-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-feature-test-results
          path: intraday-feature-tests.log
          if-no-files-found: warn
      - name: Test summary
        if: always()
        run: |
          echo "## Intraday feature safety tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No PAPER broker writes are performed." >> "$GITHUB_STEP_SUMMARY"
