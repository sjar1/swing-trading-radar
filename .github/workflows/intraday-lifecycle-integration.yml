name: Intraday Lifecycle Integration Safety Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intraday-lifecycle-integration.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Cross-component order lifecycle and failure tests
        run: python -m unittest -v test_intraday_fill_attribution.py test_intraday_order_ownership.py test_intraday_lifecycle_integration.py test_intraday_broker_recovery.py test_intraday_execution_protocol.py test_intraday_eod_reconciliation.py test_intraday_durable_ack.py
