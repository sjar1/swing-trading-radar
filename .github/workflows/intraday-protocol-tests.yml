name: Intraday Execution and Flattening Protocol Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intraday-protocol-tests.yml'
permissions:
  contents: read
jobs:
  safety-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test submission ambiguity and EOD flatten ordering
        run: python -m unittest -v test_intraday_execution_protocol.py test_intraday_eod_reconciliation.py test_intraday_execution_adapter.py
