name: Intraday Durable Acknowledgement Safety Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intraday-durable-ack-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test durable acknowledgement transitions and protocol
        run: python -m unittest -v test_intraday_durable_ack.py test_intraday_execution_protocol.py test_intraday_eod_reconciliation.py
