name: Intraday Early Warning
on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, weekdays; wider UTC window handles US daylight saving.
    - cron: '*/15 13-21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: trading-radar-data-writes
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Read-only intraday market scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python intraday_watch.py
      - name: Publish market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/intraday.json
          if ! git diff --cached --quiet; then
            git commit -m "Update intraday early-warning snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
