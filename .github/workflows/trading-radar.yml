name: Trading Radar Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_trading_radar.py
      - run: python trading_radar.py --run
      - name: Update simulated paper account
        run: python paper_trade.py
      - name: Execute Alpaca paper trades
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python alpaca_paper.py
      - name: Preserve historical data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/signals.json docs/data/history.json docs/data/paper_account.json
          if [ -f docs/data/alpaca_paper.json ]; then git add docs/data/alpaca_paper.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update trading radar snapshots"
            git push
          fi
