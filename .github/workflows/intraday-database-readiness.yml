name: Intraday PAPER Database Readiness (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Offline database safety tests
        run: python -m unittest -v test_intraday_database_readiness.py test_intraday_durable_ownership_probe.py
      - name: Inspect isolated intraday database without writes
        env:
          INTRADAY_DATABASE_URL: ${{ secrets.INTRADAY_DATABASE_URL }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_database_readiness.py
