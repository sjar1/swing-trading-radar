name: Intraday PAPER Recovery Diagnostic (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Offline safety tests
        run: python -m unittest -v test_intraday_recovery_diagnostic.py test_intraday_recovery_readiness.py test_intraday_durable_ownership_probe.py
      - name: Inspect PAPER broker and isolated database without writes
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
          ALPACA_INTRADAY_EXPECTED_ACCOUNT_ID: ${{ secrets.ALPACA_INTRADAY_EXPECTED_ACCOUNT_ID }}
          INTRADAY_DATABASE_URL: ${{ secrets.INTRADAY_DATABASE_URL }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_recovery_diagnostic.py
