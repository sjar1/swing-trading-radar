name: Intraday Momentum PAPER (dry run)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 14-20 * * 1-5'
permissions:
  contents: read
concurrency:
  group: intraday-momentum-paper
  cancel-in-progress: false
jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest -v test_intraday_engine.py test_intraday_lifecycle.py test_intraday_paper_pilot.py test_intraday_reconciliation.py test_intraday_ledger.py test_intraday_calendar.py test_intraday_scanner_calendar.py test_intraday_equity_state.py test_intraday_flatten_controller.py test_intraday_transaction_store.py test_intraday_crash_recovery.py test_intraday_postgres_store.py test_intraday_broker_db_audit.py test_intraday_session_bootstrap.py test_intraday_session_verify.py test_intraday_equity_monitor.py test_intraday_fault_injection.py test_intraday_pilot_preflight.py test_intraday_execution_adapter.py
      - name: Scan with PAPER credentials (no orders by default)
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_engine.py
      - name: Read-only PAPER lifecycle and account risk audit
        if: always()
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
        run: python intraday_lifecycle.py
      - name: Run offline crash and equity fault injection
        run: python intraday_fault_injection.py
      - name: Run offline crash and equity fault injection
        run: python intraday_fault_injection.py
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-engine-diagnostics
          path: |
            docs/data/intraday_engine.json
            docs/data/intraday_lifecycle.json
            docs/data/intraday_safety.json
          if-no-files-found: warn
