name: Intraday Engine Dry-Run Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated intraday feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run intraday and lifecycle unit tests
        run: python -m unittest -v test_intraday_engine.py test_intraday_lifecycle.py test_intraday_paper_pilot.py test_intraday_reconciliation.py test_intraday_ledger.py test_intraday_calendar.py test_intraday_scanner_calendar.py test_intraday_equity_state.py test_intraday_flatten_controller.py test_intraday_transaction_store.py test_intraday_crash_recovery.py test_intraday_postgres_store.py test_intraday_broker_db_audit.py test_intraday_session_bootstrap.py
      - name: PAPER scanner (read-only, orders disabled)
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_engine.py
      - name: PAPER lifecycle audit (read-only)
        if: always()
        env:
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
        run: python intraday_lifecycle.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-validation-diagnostics
          path: |
            docs/data/intraday_engine.json
            docs/data/intraday_lifecycle.json
          if-no-files-found: warn
