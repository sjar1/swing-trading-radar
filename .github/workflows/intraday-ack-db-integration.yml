name: Intraday Durable ACK Supabase Integration
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ISOLATED_TEST_ONLY (creates and drops a temporary schema)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolated-db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Actual transactional ACK integration tests (isolated schema only)
        env:
          INTRADAY_DATABASE_URL: ${{ secrets.INTRADAY_DATABASE_URL }}
          INTRADAY_DB_TEST_CONFIRM: ${{ inputs.confirmation }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_ack_db_integration.py
