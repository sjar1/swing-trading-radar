name: Intraday PAPER Blocked Session Bootstrap
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INITIALIZE_BLOCKED_SESSION to authorize Supabase session/equity writes (NO orders)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: intraday-session-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: ${{ inputs.confirm == 'INITIALIZE_BLOCKED_SESSION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate bootstrap safety
        run: python -m unittest -v test_intraday_session_bootstrap.py
      - name: Create blocked session and equity sample (database writes only)
        env:
          INTRADAY_DATABASE_URL: ${{ secrets.INTRADAY_DATABASE_URL }}
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_session_bootstrap.py
