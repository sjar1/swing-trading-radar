name: Intraday PAPER Execution Adapter Dry Run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intraday-momentum-paper-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Hard-disable execution safety tests
        run: python -m unittest -v test_intraday_execution_adapter.py
      - name: PAPER adapter no-submit read-only dry run
        env:
          INTRADAY_DATABASE_URL: ${{ secrets.INTRADAY_DATABASE_URL }}
          ALPACA_INTRADAY_API_KEY: ${{ secrets.ALPACA_INTRADAY_API_KEY }}
          ALPACA_INTRADAY_API_SECRET: ${{ secrets.ALPACA_INTRADAY_API_SECRET }}
          INTRADAY_PAPER_ORDERS: '0'
        run: python intraday_execution_adapter.py
